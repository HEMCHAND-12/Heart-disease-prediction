[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-disease-parsel"
version = "0.1.0"
description = "CPU-friendly reproduction workspace for the PaRSEL heart-disease stacking model."
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
